<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sitata.uz</title>
<script>
  // sitata.uz/taxallus (va eski sitata.uz/@taxallus) — chiroyli profil manzillari. GitHub Pages bunday sahifani topmay,
  // shu faylni ochadi; biz uni saytning o'zidagi #@taxallus yo'liga yo'naltiramiz.
  // Saytning o'z sahifalari nomi (javon, lenta…) taxallus bo'la olmaydi — ular #bo'limga o'tadi.
  (function () {
    var BOLIMLAR = ["bosh", "lenta", "viktorina", "mualliflar", "karta", "reyting", "kitobdoshlar", "javon", "liga", "daraja", "birga", "qoidalar", "haqida", "profilim", "admin", "guruhlar", "duellar", "xulosa"];
    var m = location.pathname.match(/^\/(@?)([A-Za-z0-9_]{3,20})\/?$/);
    if (!m) return;
    var nom = m[2].toLowerCase();
    if (!m[1] && BOLIMLAR.indexOf(nom) >= 0) { location.replace("/#" + nom); return; }
    location.replace("/#@" + nom);
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
         background: #E9DFCA; color: #3B2A1A; font-family: Georgia, serif; padding: 16px; }
  a { color: #8C4A2F; }
</style>
</head>
<body>
  <div>
    <h1>Sahifa topilmadi</h1>
    <p><a href="/">sitata.uz bosh sahifasiga qaytish</a></p>
  </div>
</body>
</html>
