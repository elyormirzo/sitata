<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kim aytgan? — sitata.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

<style>
  /* ===== 1. RANGLAR VA ASOSIY USLUB ===== */
  :root {
    --fon: #E9DFCA;          /* kitob javoni / zig'ir mato */
    --qogoz: #F8F1E1;        /* yangi qog'oz */
    --qora: #3B2A1A;         /* siyoh */
    --kulrang: #7A6448;
    --teri: #8C4A2F;         /* teri muqova */
    --teri-toq: #6B3E26;
    --zaytun: #4F5B3A;       /* to'q yashil muqova */
    --zaytun-och: #E1E4CF;
    --qizil-och: #F3D9C6;
    --chegara: #D8C7A3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background-color: var(--fon);
    background-image:                              /* zig'ir mato teksturasi */
      repeating-linear-gradient(0deg, rgba(120,90,50,.035) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(120,90,50,.035) 0 1px, transparent 1px 3px);
    color: var(--qora);
    font-family: Inter, system-ui, sans-serif;
  }
  .ilova { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }

  header { text-align: center; margin-bottom: 16px; }
  header h1 { font-family: Lora, Georgia, serif; font-size: 32px; margin: 0; color: var(--qora); }
  header h1::after { content: "❧"; display: block; font-size: 16px; color: #B98A55; margin-top: 2px; }
  header p { margin: 4px 0 0; color: var(--kulrang); font: italic 14px Lora, Georgia, serif; }

  /* Iqtibos kartasi: eski kitob sahifasi ko'rinishida */
  .karta {
    position: relative; color: #3B2A1A;
    background-color: #F4EAD5;
    background-image:
      linear-gradient(90deg, rgba(110,70,30,.22), rgba(110,70,30,0) 22px),   /* kitob umurtqasi soyasi */
      radial-gradient(ellipse at 50% 40%, rgba(255,250,235,.7), rgba(255,250,235,0) 70%),
      radial-gradient(ellipse at 100% 100%, rgba(150,100,40,.18), rgba(150,100,40,0) 45%),
      radial-gradient(ellipse at 0% 0%, rgba(150,100,40,.12), rgba(150,100,40,0) 40%);
    border: 1px solid #E0CFA8;
    border-radius: 6px 16px 16px 6px; padding: 22px 22px 18px 30px; margin-bottom: 22px;
    box-shadow:                                   /* orqadagi varaqlar */
      3px 3px 0 -1px #EFE2C4, 3px 3px 0 0 #DCC9A0,
      6px 6px 0 -1px #EADBB9, 6px 6px 0 0 #D5C095,
      0 14px 28px rgba(80,50,20,.18);
  }
  .karta small {
    display: block; text-align: center; color: #8C5A2B; font: italic 500 14px Lora, Georgia, serif;
    letter-spacing: .3px;
  }
  .karta small::before, .karta small::after { content: "—"; margin: 0 8px; color: #C49A6C; }
  .karta blockquote {
    position: relative; margin: 14px 0 8px; padding-left: 4px; font-family: Lora, Georgia, serif;
    font-size: 21px; line-height: 1.5; white-space: pre-line; color: #3B2A1A;
  }
  .karta blockquote::first-letter {               /* bosh harf — kitoblardagidek bezakli */
    float: left; font-size: 52px; line-height: .9; margin: 4px 8px 0 0; color: #A4502A; font-weight: 600;
  }
  .bezak { text-align: center; color: #B98A55; font: 600 44px/1 Lora, Georgia, serif; height: 26px; margin: 2px 0 12px; }

  /* Portret: ism harflari soniga teng bo'laklarga bo'lingan */
  .portret {
    position: relative; width: 100%; max-width: 240px; aspect-ratio: 4 / 5;
    margin: 0 auto; border-radius: 4px; overflow: hidden; background: #E8DABA;
    border: 6px solid #FBF5E6; outline: 1px solid #CDB68A;
    box-shadow: 0 6px 14px rgba(80,50,20,.22);
  }
  .portret img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .portret .bosh-harf {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 600 72px Lora, Georgia, serif; color: #fff;
    background: linear-gradient(160deg, #8C4A2F, #4A2A18);
  }
  .bolak {
    position: absolute; display: flex; align-items: center; justify-content: center;
    font: 600 15px Lora, Georgia, serif; color: rgba(251,245,230,.55);
    border: 1px solid rgba(251,245,230,.35);
    transition: opacity .45s ease, transform .45s ease;
  }
  .bolak.ochiq { opacity: 0; transform: scale(.4) rotate(8deg); pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .bolak { transition: opacity .2s; } .bolak.ochiq { transform: none; } }

  /* Xatolar chizig'i */
  .xatolar { display: flex; gap: 6px; margin-top: 16px; }
  .xatolar span { flex: 1; height: 6px; border-radius: 3px; background: #E2D3B3; }
  .xatolar span.ishlatildi { background: #B5502A; }
  .xato-matn { margin-top: 6px; font: italic 13px Lora, Georgia, serif; color: #7A6448; text-align: center; }

  /* Ism katakchalari */
  .ism { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 16px; margin: 4px 0 14px; }
  .soz { display: flex; gap: 4px; }
  .harf-katak {                                  /* bosmaxona harf-qoliplari */
    width: 26px; height: 36px; border-radius: 3px; background: var(--qogoz);
    border: 1px solid var(--chegara); border-bottom: 3px solid #CDB68A;
    display: flex; align-items: center; justify-content: center;
    font: 600 19px Lora, Georgia, serif; text-transform: uppercase; color: var(--qora);
  }
  .harf-katak.topildi { background: var(--zaytun-och); border-color: #B7BE98; border-bottom-color: var(--zaytun); color: var(--zaytun); }
  .harf-katak.korsatildi { background: var(--qizil-och); border-color: #E2B89C; border-bottom-color: var(--teri); color: var(--teri); }
  .harf-katak.belgi { width: 10px; border: 0; background: none; }

  /* Ishoralar */
  .ishoralar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 26px; margin-bottom: 12px; }
  .ishora {                                      /* kitob xatcho'pi */
    font: italic 500 13px Lora, Georgia, serif; padding: 5px 14px 5px 10px; color: #FBF5E6;
    background: var(--teri); border-radius: 2px;
    clip-path: polygon(0 0, 100% 0, calc(100% - 7px) 50%, 100% 100%, 0 100%);
  }

  /* Harflar klaviaturasi */
  .klaviatura { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .tugma {                                       /* harf-qoliplar */
    height: 46px; border-radius: 4px; background: var(--qogoz); color: var(--qora);
    border: 1px solid var(--chegara); border-bottom: 3px solid #CDB68A;
    font: 600 18px Lora, Georgia, serif; cursor: pointer; padding: 0;
    transition: background .15s, transform .1s, border-color .15s;
  }
  .tugma:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 1px; }
  .tugma:disabled { cursor: default; }
  .tugma.togri { background: var(--zaytun); border-color: var(--zaytun); border-bottom-color: #353D26; color: #F8F1E1; }
  .tugma.xato { background: transparent; border-color: #D9CBAE; border-bottom-width: 1px; color: #B9A88A; text-decoration: line-through; }
  .izoh-satr { font: italic 13px Lora, Georgia, serif; color: var(--kulrang); margin: 12px 0 0; text-align: center; line-height: 1.5; }

  button.asosiy {                                /* teri muqovali tugma */
    height: 52px; border-radius: 6px; cursor: pointer;
    background: linear-gradient(180deg, var(--teri), var(--teri-toq)); color: #FBF5E6;
    border: 1px solid #5A3220; box-shadow: inset 0 0 0 3px rgba(251,245,230,.12);
    font: 600 17px Lora, Georgia, serif; letter-spacing: .3px;
  }
  .natija {                                      /* yakuniy sahifa */
    margin-top: 4px; padding: 20px 20px 18px; border-radius: 4px; background: var(--qogoz);
    border: 1px solid var(--chegara); box-shadow: 0 8px 20px rgba(80,50,20,.12);
    text-align: center; display: flex; flex-direction: column; gap: 12px;
  }
  .natija h2 { margin: 0; font-family: Lora, Georgia, serif; font-size: 24px; color: var(--qora); }
  .natija h2::before, .natija h2::after { content: "❦"; font-size: 16px; color: #B98A55; margin: 0 10px; vertical-align: middle; }
  #natijaMatn { font: italic 16px Lora, Georgia, serif; }
  .natija .izoh { font: italic 13px Lora, Georgia, serif; color: var(--kulrang); }
  .natija-rasm {
    width: 100%; max-width: 300px; margin: 0 auto; display: block; border-radius: 4px;
    box-shadow: 0 6px 16px rgba(80,50,20,.2);
  }
  .tugmalar-qator { display: flex; gap: 8px; }
  button.ikkinchi {
    flex: 1; height: 44px; border-radius: 6px; cursor: pointer; background: transparent; color: var(--teri);
    border: 1px solid #C9A887; font: 500 14px Lora, Georgia, serif;
  }
  .ulash-xabar { min-height: 18px; font: italic 14px Lora, Georgia, serif; color: var(--zaytun); }
  .ulash-matn {
    width: 100%; resize: none; padding: 10px 12px; border-radius: 4px; border: 1px solid var(--chegara);
    background: #fff; color: var(--qora); font: 14px/1.5 Inter, sans-serif; text-align: left;
  }
  .manba { margin-top: 24px; text-align: center; font: italic 12px Lora, Georgia, serif; color: #9A8466; }
  .manba a { color: inherit; }
  .yashirin { display: none !important; }

  @keyframes silkinish { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .silkin { animation: silkinish .25s ease 2; }
  @media (prefers-reduced-motion: reduce) { .silkin { animation: none; } }
</style>
</head>
<body>
<div class="ilova">

  <header>
    <h1>Kim aytgan?</h1>
    <p>Muallif ismini harfma-harf toping — har bir harf suratning bir bo'lagini ochadi</p>
  </header>

  <section class="karta">
    <small>Bugungi iqtibos</small>
    <blockquote id="iqtibosMatni"></blockquote>
    <div class="bezak" aria-hidden="true">”</div>
    <div class="portret" id="portret"></div>
    <div class="xatolar" id="xatolar"></div>
    <div class="xato-matn" id="xatoMatn"></div>
  </section>

  <div class="ism" id="ism"></div>
  <div class="ishoralar" id="ishoralar"></div>

  <div id="oyin">
    <div class="klaviatura" id="klaviatura"></div>
    <p class="izoh-satr">Har bir xato harfdan keyin ishora ochiladi: faoliyat, davr, hudud.</p>
  </div>

  <section class="natija yashirin" id="natija">
    <h2 id="natijaSarlavha"></h2>
    <div id="natijaMatn"></div>
    <img class="natija-rasm yashirin" id="natijaRasm" alt="Natija rasmi: iqtibos, portret va natija">
    <button type="button" class="asosiy" id="ulashish">Rasm bilan ulashish</button>
    <div class="tugmalar-qator">
      <button type="button" class="ikkinchi" id="yuklab">Rasmni yuklab olish</button>
      <button type="button" class="ikkinchi" id="matnNusxa">Matnni nusxalash</button>
    </div>
    <div class="ulash-xabar" id="ulashXabar" role="status"></div>
    <textarea class="ulash-matn yashirin" id="ulashMatn" readonly rows="4"></textarea>
    <div class="izoh">Ertaga yangi sahifa ochiladi</div>
  </section>

  <p class="manba">Portretlar: <a href="rasmlar/manbalar.txt">Wikimedia Commons</a></p>
</div>

<script>
// ===== 2. MA'LUMOTLAR =====
// Har bir muallif: davr (asr; miloddan avvalgi bo'lsa manfiy son), kasb (faoliyat), yurt (hudud), rasm.
// Yangi muallif qo'shish uchun shu ro'yxatga yana bitta qator yozing.
// Rasm bo'lmasa (null), suratda muallif ismining bosh harflari chiqadi.
const MUALLIFLAR = {
  "Alisher Navoiy":     { davr: 15,  kasb: "Shoir",    yurt: "O'rta Osiyo", rasm: null },
  "Zahiriddin Bobur":   { davr: 16,  kasb: "Shoir",    yurt: "O'rta Osiyo", rasm: "rasmlar/bobur.jpg" },
  "Mirzo Ulug'bek":     { davr: 15,  kasb: "Olim",     yurt: "O'rta Osiyo", rasm: "rasmlar/ulugbek.jpg" },
  "Ibn Sino":           { davr: 11,  kasb: "Olim",     yurt: "O'rta Osiyo", rasm: "rasmlar/ibn-sino.jpg" },
  "Abu Rayhon Beruniy": { davr: 11,  kasb: "Olim",     yurt: "O'rta Osiyo", rasm: "rasmlar/beruniy.jpg" },
  "Abdulla Qodiriy":    { davr: 20,  kasb: "Yozuvchi", yurt: "O'rta Osiyo", rasm: null },
  "Suqrot":             { davr: -5,  kasb: "Faylasuf", yurt: "Yunoniston",  rasm: "rasmlar/suqrot.jpg" },
  "Aristotel":          { davr: -4,  kasb: "Faylasuf", yurt: "Yunoniston",  rasm: "rasmlar/aristotel.jpg" },
  "Konfutsiy":          { davr: -6,  kasb: "Faylasuf", yurt: "Xitoy",       rasm: "rasmlar/konfutsiy.jpg" },
  "Rene Dekart":        { davr: 17,  kasb: "Faylasuf", yurt: "Fransiya",    rasm: "rasmlar/dekart.jpg" },
  "Frensis Bekon":      { davr: 16,  kasb: "Faylasuf", yurt: "Angliya",     rasm: "rasmlar/bekon.jpg" },
  "Isaak Nyuton":       { davr: 17,  kasb: "Olim",     yurt: "Angliya",     rasm: "rasmlar/nyuton.jpg" },
  "Uilyam Shekspir":    { davr: 16,  kasb: "Yozuvchi", yurt: "Angliya",     rasm: "rasmlar/shekspir.jpg" },
  "Lev Tolstoy":        { davr: 19,  kasb: "Yozuvchi", yurt: "Rossiya",     rasm: "rasmlar/tolstoy.jpg" },
  "Fyodor Dostoyevskiy":{ davr: 19,  kasb: "Yozuvchi", yurt: "Rossiya",     rasm: "rasmlar/dostoyevskiy.jpg" },
  "Aleksandr Pushkin":  { davr: 19,  kasb: "Shoir",    yurt: "Rossiya",     rasm: "rasmlar/pushkin.jpg" },
  "Albert Eynshteyn":   { davr: 20,  kasb: "Olim",     yurt: "Germaniya",   rasm: "rasmlar/eynshteyn.jpg" },
};

// Iqtiboslar. Har kuni ro'yxatdan navbatdagisi chiqadi.
// Muhim: ishga tushirishdan oldin har bir iqtibosni manbadan tekshiring!
const IQTIBOSLAR = [
  { matn: "Odami ersang, demagil odami,\nOniki yo'q xalq g'amidin g'ami.", muallif: "Alisher Navoiy" },
  { matn: "Fikrlayapman, demak, mavjudman.", muallif: "Rene Dekart" },
  { matn: "Har kimki vafo qilsa, vafo topqusidir,\nHar kimki jafo qilsa, jafo topqusidir.", muallif: "Zahiriddin Bobur" },
  { matn: "Men faqat bir narsani bilaman: hech narsa bilmayman.", muallif: "Suqrot" },
  { matn: "Tasavvur bilimdan muhimroq.", muallif: "Albert Eynshteyn" },
  { matn: "Bo'lish yoki bo'lmaslik — mana masala.", muallif: "Uilyam Shekspir" },
  { matn: "Bilganingni bilaman de, bilmaganingni bilmayman de — mana shu bilimdir.", muallif: "Konfutsiy" },
  { matn: "Hamma baxtli oilalar bir-biriga o'xshaydi, har bir baxtsiz oila esa o'zicha baxtsiz.", muallif: "Lev Tolstoy" },
  { matn: "Bilim — kuch.", muallif: "Frensis Bekon" },
  { matn: "Go'zallik dunyoni qutqaradi.", muallif: "Fyodor Dostoyevskiy" },
  { matn: "Inson tabiatan ijtimoiy mavjudotdir.", muallif: "Aristotel" },
];

const MAX_XATO = 5;
// O'zbek lotin alifbosidagi harflar (C va W yo'q)
const ALIFBO = "ABDEFGHIJKLMNOPQRSTUVXYZ".split("");
// Surat ustidagi bo'laklar ranglari
// (eski kitob muqovalari: teri, jigarrang, to'q yashil, bordo)
const BOLAK_RANGLARI = ["#8C4A2F", "#6B3E26", "#7A5230", "#4F5B3A", "#7B2E2E", "#9A6235"];

const $ = (id) => document.getElementById(id);

// ===== 3. BUGUNGI IQTIBOS =====
// 1970-yildan beri o'tgan kunlar soni bo'yicha: hamma odamda bir kunda bir xil iqtibos chiqadi.
const bugungiKun = Math.floor((Date.now() + 5 * 3600 * 1000) / 86400000); // Toshkent vaqti (UTC+5)
const bugungi = IQTIBOSLAR[bugungiKun % IQTIBOSLAR.length];
const muallif = MUALLIFLAR[bugungi.muallif];
const ISM = bugungi.muallif.toUpperCase();

// Ismdagi harflar o'rni (bo'sh joy va tutuq belgisi hisobga olinmaydi)
const harfOrinlari = [];
for (let i = 0; i < ISM.length; i++) if (/[A-Z]/.test(ISM[i])) harfOrinlari.push(i);
const BOLAKLAR_SONI = harfOrinlari.length; // ismda nechta harf bo'lsa, surat shuncha bo'lakka bo'linadi

// Kun raqamiga bog'liq tasodif: bo'laklar har kuni boshqacha joylashadi, lekin hammada bir xil.
function urugliTasodif(urug) {
  return () => {
    urug = (urug + 0x6D2B79F5) | 0;
    let t = Math.imul(urug ^ (urug >>> 15), 1 | urug);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function aralashtir(royxat, tasodif) {
  const a = royxat.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(tasodif() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// harfBolagi[k] — ismning k-harfi suratning qaysi bo'lagini ochadi
const harfBolagi = aralashtir([...Array(BOLAKLAR_SONI).keys()], urugliTasodif(bugungiKun));

// ===== 4. O'YIN HOLATI (brauzer xotirasida saqlanadi) =====
let holat = { kun: bugungiKun, harflar: [], tugadi: false, yutdi: false };
try {
  const saqlangan = JSON.parse(localStorage.getItem("kimAytganHarf"));
  if (saqlangan && saqlangan.kun === bugungiKun) holat = saqlangan;
} catch (e) { /* xotira ishlamasa, oddiy davom etamiz */ }

function saqlash() {
  try { localStorage.setItem("kimAytganHarf", JSON.stringify(holat)); } catch (e) {}
}

const ismdami = (h) => ISM.includes(h);
const xatolarSoni = () => holat.harflar.filter((h) => !ismdami(h)).length;
const hammasiTopildimi = () => harfOrinlari.every((i) => holat.harflar.includes(ISM[i]));

// ===== 5. SURATNI BO'LAKLARGA BO'LISH =====
// N ta bo'lakni qatorlarga teng taqsimlaymiz (masalan 13 → 4+3+3+3), har qator ichida teng kenglikda.
function bolakJoylari(n) {
  const qatorlar = Math.max(1, Math.round(Math.sqrt(n * 5 / 4)));
  const joylar = [];
  let qolgan = n;
  for (let q = 0; q < qatorlar; q++) {
    const bu = Math.ceil(qolgan / (qatorlar - q));
    for (let u = 0; u < bu; u++) {
      joylar.push({ chap: (u / bu) * 100, yuqori: (q / qatorlar) * 100, en: 100 / bu, boy: 100 / qatorlar });
    }
    qolgan -= bu;
  }
  return joylar;
}

function portretniQur() {
  const p = $("portret");
  p.innerHTML = "";
  const boshHarf = document.createElement("div");
  boshHarf.className = "bosh-harf";
  boshHarf.textContent = bugungi.muallif.split(" ").map((s) => s[0]).join("");
  p.appendChild(boshHarf);
  if (muallif.rasm) {
    const img = document.createElement("img");
    img.src = muallif.rasm;
    img.alt = ""; // ism yashirin qolsin
    img.onload = () => boshHarf.remove();
    img.onerror = () => img.remove();
    p.appendChild(img);
  }
  bolakJoylari(BOLAKLAR_SONI).forEach((j, i) => {
    const b = document.createElement("div");
    b.className = "bolak";
    b.id = "bolak" + i;
    Object.assign(b.style, {
      left: j.chap + "%", top: j.yuqori + "%", width: j.en + "%", height: j.boy + "%",
      background: BOLAK_RANGLARI[i % BOLAK_RANGLARI.length],
    });
    b.textContent = "?";
    p.appendChild(b);
  });
}

// ===== 6. EKRANGA CHIQARISH =====
function davrMatni(asr) {
  const rim = ["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"];
  return asr < 0 ? "Mil. av. " + rim[-asr] + " asr" : rim[asr] + " asr";
}

function chiz() {
  $("iqtibosMatni").textContent = bugungi.matn;

  // Surat bo'laklari: topilgan harflarning bo'laklari ochiladi, o'yin tugasa hammasi
  harfOrinlari.forEach((orin, k) => {
    const ochiq = holat.tugadi || holat.harflar.includes(ISM[orin]);
    $("bolak" + harfBolagi[k]).classList.toggle("ochiq", ochiq);
  });

  // Xatolar chizig'i
  const xato = xatolarSoni();
  $("xatolar").innerHTML = "";
  for (let i = 0; i < MAX_XATO; i++) {
    const s = document.createElement("span");
    if (i < xato) s.className = "ishlatildi";
    $("xatolar").appendChild(s);
  }
  $("xatoMatn").textContent = `Xato harflar: ${xato} / ${MAX_XATO}`;

  // Ism katakchalari (har bir so'z alohida guruh)
  $("ism").innerHTML = "";
  bugungi.muallif.toUpperCase().split(" ").forEach((soz) => {
    const guruh = document.createElement("div");
    guruh.className = "soz";
    [...soz].forEach((h) => {
      const k = document.createElement("div");
      k.className = "harf-katak";
      if (!/[A-Z]/.test(h)) { k.classList.add("belgi"); k.textContent = h; }
      else if (holat.harflar.includes(h)) { k.classList.add("topildi"); k.textContent = h; }
      else if (holat.tugadi) { k.classList.add("korsatildi"); k.textContent = h; }
      guruh.appendChild(k);
    });
    $("ism").appendChild(guruh);
  });

  // Ishoralar: har bir xato harfdan keyin bittadan
  const ishoralar = [
    "Faoliyat: " + muallif.kasb,
    "Davr: " + davrMatni(muallif.davr),
    "Hudud: " + muallif.yurt,
  ];
  $("ishoralar").innerHTML = "";
  ishoralar.slice(0, holat.tugadi ? 0 : xato).forEach((matn) => {
    const s = document.createElement("span");
    s.className = "ishora";
    s.textContent = matn;
    $("ishoralar").appendChild(s);
  });

  // Klaviatura
  $("klaviatura").innerHTML = "";
  ALIFBO.forEach((h) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tugma";
    b.textContent = h;
    b.dataset.harf = h;
    if (holat.harflar.includes(h)) { b.classList.add(ismdami(h) ? "togri" : "xato"); b.disabled = true; }
    if (holat.tugadi) b.disabled = true;
    b.addEventListener("click", () => harfBos(h));
    $("klaviatura").appendChild(b);
  });

  // O'yin tugaganmi?
  if (holat.tugadi) {
    $("oyin").classList.add("yashirin");
    $("natija").classList.remove("yashirin");
    $("natijaSarlavha").textContent = holat.yutdi ? "Barakalla!" : "Bu safar topilmadi";
    $("natijaMatn").textContent = "Muallif: " + bugungi.muallif;
    natijaRasminiTayyorla();
  }
}

// ===== 7. HARF BOSILGANDA =====
function harfBos(h) {
  if (holat.tugadi || holat.harflar.includes(h)) return;
  holat.harflar.push(h);
  if (hammasiTopildimi()) { holat.yutdi = true; holat.tugadi = true; }
  else if (xatolarSoni() >= MAX_XATO) { holat.tugadi = true; }
  saqlash();
  chiz();
  if (!ismdami(h) && !holat.tugadi) {
    const t = $("klaviatura").querySelector(`[data-harf="${h}"]`);
    if (t) t.classList.add("silkin");
  }
}

// Kompyuter klaviaturasidan ham yozish mumkin
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const h = e.key.toUpperCase();
  if (ALIFBO.includes(h)) harfBos(h);
});

// ===== 8. NATIJANI ULASHISH =====
// Natija rasm sifatida chiziladi (iqtibos + portret + natija), Instagram, Telegram, Facebook uchun.
// O'lcham 1080×1350 (4:5) — Instagram lentasiga to'liq sig'adi, Telegram va Facebook'da ham chiroyli.
const SAYT_MANZILI = location.protocol.startsWith("http")
  ? location.origin + location.pathname.replace(/index\.html$/, "")
  : "https://elyormirzo.github.io/sitata/";

function ulashMatni() {
  const qator = holat.harflar.map((h) => (ismdami(h) ? "🟩" : "🟥")).join("");
  const hisob = holat.yutdi ? `topdim, ${xatolarSoni()} ta xato bilan` : "topa olmadim";
  return `Kim aytgan? — ${hisob}\n${qator}\n${SAYT_MANZILI}`;
}

function rasmYukla(src) {
  return new Promise((ok) => {
    if (!src) return ok(null);
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = () => ok(null);
    img.src = src;
  });
}

// Matnni berilgan kenglikka sig'diradigan qatorlarga bo'lish
function qatorlargaBol(ctx, matn, kenglik) {
  const natija = [];
  matn.split("\n").forEach((paragraf) => {
    let qator = "";
    paragraf.split(" ").forEach((soz) => {
      const sinov = qator ? qator + " " + soz : soz;
      if (ctx.measureText(sinov).width > kenglik && qator) { natija.push(qator); qator = soz; }
      else qator = sinov;
    });
    natija.push(qator);
  });
  return natija;
}

let natijaFayli = null; // tayyor PNG (Blob)

async function natijaRasminiChiz() {
  try {
    await Promise.all([
      document.fonts.load('500 48px "Lora"'), document.fonts.load('italic 500 32px "Lora"'),
      document.fonts.load('600 56px "Lora"'),
    ]);
  } catch (e) { /* shriftsiz ham chizamiz */ }

  const W = 1080, H = 1350, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  const serif = '"Lora", Georgia, serif';

  // Fon: zig'ir mato va kitob sahifasi
  ctx.fillStyle = "#E9DFCA"; ctx.fillRect(0, 0, W, H);
  const X = 60, Y = 60, PW = W - 120, PH = H - 120;
  ctx.fillStyle = "#D5C095"; ctx.fillRect(X + 14, Y + 14, PW, PH);   // orqadagi varaqlar
  ctx.fillStyle = "#EADBB9"; ctx.fillRect(X + 7, Y + 7, PW, PH);
  let g = ctx.createRadialGradient(W / 2, H * .4, 100, W / 2, H * .4, 900);
  g.addColorStop(0, "#FBF4E3"); g.addColorStop(1, "#EBDDBE");
  ctx.fillStyle = g; ctx.fillRect(X, Y, PW, PH);
  g = ctx.createLinearGradient(X, 0, X + 50, 0);                     // kitob umurtqasi soyasi
  g.addColorStop(0, "rgba(110,70,30,.25)"); g.addColorStop(1, "rgba(110,70,30,0)");
  ctx.fillStyle = g; ctx.fillRect(X, Y, 50, PH);
  ctx.strokeStyle = "#D8C7A3"; ctx.lineWidth = 2; ctx.strokeRect(X, Y, PW, PH);

  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  let y = Y + 90;
  ctx.fillStyle = "#8C5A2B"; ctx.font = `italic 500 32px ${serif}`;
  ctx.fillText("— Kim aytgan? —", W / 2, y);

  // Iqtibos: sig'guncha shrift kichrayadi
  let olcham = 50, qatorlar;
  do {
    ctx.font = `500 ${olcham}px ${serif}`;
    qatorlar = qatorlargaBol(ctx, "“" + bugungi.matn + "”", PW - 160);
    olcham -= 2;
  } while (qatorlar.length * olcham * 1.4 > 300 && olcham > 28);
  olcham += 2;
  const qatorBalandligi = olcham * 1.4;
  y += 50 + olcham;
  ctx.fillStyle = "#3B2A1A";
  qatorlar.forEach((q) => { ctx.fillText(q, W / 2, y); y += qatorBalandligi; });

  // Portret ramkada
  // Portret balandligi qolgan joyga moslashadi (uzun iqtibosda kichrayadi)
  const pastkiQism = 330;                                   // ism, ma'lumot, natija, sayt manzili
  const ph = Math.max(300, Math.min(500, (Y + PH) - pastkiQism - (y + 10) - 14));
  const pw = Math.round(ph * 0.8), px = (W - pw) / 2, py = y + 10;
  ctx.save();
  ctx.shadowColor = "rgba(80,50,20,.3)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.fillStyle = "#FBF5E6"; ctx.fillRect(px - 14, py - 14, pw + 28, ph + 28);
  ctx.restore();
  ctx.strokeStyle = "#CDB68A"; ctx.lineWidth = 2; ctx.strokeRect(px - 14, py - 14, pw + 28, ph + 28);
  const img = await rasmYukla(muallif.rasm);
  if (img) {
    const k = Math.max(pw / img.width, ph / img.height);             // "cover", yuqori qismi
    const sw = pw / k, sh = ph / k;
    ctx.drawImage(img, (img.width - sw) / 2, 0, sw, sh, px, py, pw, ph);
  } else {
    g = ctx.createLinearGradient(px, py, px + pw, py + ph);
    g.addColorStop(0, "#8C4A2F"); g.addColorStop(1, "#4A2A18");
    ctx.fillStyle = g; ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = "#FBF5E6"; ctx.font = `600 150px ${serif}`;
    ctx.fillText(bugungi.muallif.split(" ").map((s) => s[0]).join(""), W / 2, py + ph / 2 + 55);
  }
  y = py + ph + 86;

  // Muallif va ma'lumot
  ctx.fillStyle = "#3B2A1A"; ctx.font = `600 54px ${serif}`;
  ctx.fillText(bugungi.muallif, W / 2, y);
  y += 48;
  ctx.fillStyle = "#7A6448"; ctx.font = `italic 500 30px ${serif}`;
  ctx.fillText(`${muallif.kasb} · ${davrMatni(muallif.davr)} · ${muallif.yurt}`, W / 2, y);

  // Natija: kvadratchalar va matn
  y += 50;
  const kv = 30, oraliq = 8, n = holat.harflar.length;
  let kx = (W - (n * kv + (n - 1) * oraliq)) / 2;
  holat.harflar.forEach((h) => {
    ctx.fillStyle = ismdami(h) ? "#4F5B3A" : "#B5502A";
    ctx.fillRect(kx, y, kv, kv); kx += kv + oraliq;
  });
  y += kv + 46;
  ctx.fillStyle = holat.yutdi ? "#4F5B3A" : "#8C4A2F"; ctx.font = `600 34px ${serif}`;
  ctx.fillText(holat.yutdi ? `Topdim — ${xatolarSoni()} ta xato bilan` : "Bu safar topa olmadim", W / 2, y);

  // Pastki qism: sayt manzili
  ctx.fillStyle = "#9A8466"; ctx.font = `italic 500 26px ${serif}`;
  ctx.fillText(SAYT_MANZILI.replace(/^https?:\/\//, "").replace(/\/$/, ""), W / 2, Y + PH - 36);

  return new Promise((ok) => c.toBlob(ok, "image/png"));
}

async function natijaRasminiTayyorla() {
  if (natijaFayli) return natijaFayli;
  try {
    natijaFayli = await natijaRasminiChiz();
    if (natijaFayli) {
      $("natijaRasm").src = URL.createObjectURL(natijaFayli);
      $("natijaRasm").classList.remove("yashirin");
    }
  } catch (e) { natijaFayli = null; }   // masalan, fayl kompyuterdan ochilganda brauzer rasmga ruxsat bermaydi
  return natijaFayli;
}

async function nusxaOl(matn) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(matn); return true; }
  } catch (e) { /* pastdagi usulni sinaymiz */ }
  try {
    const t = document.createElement("textarea");
    t.value = matn; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    const ok = document.execCommand("copy");
    t.remove();
    return ok;
  } catch (e) { return false; }
}

function rasmniYuklabOl(blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kim-aytgan.png";
  document.body.appendChild(a); a.click(); a.remove();
}

function matnniKorsat(matn) {
  const quti = $("ulashMatn");
  quti.value = matn;
  quti.classList.remove("yashirin");
  quti.focus(); quti.select();
  $("ulashXabar").textContent = "Matnni belgilab, o'zingiz nusxa oling:";
}

// Asosiy tugma: telefonda rasm + matn bilan ulashish oynasi (Instagram, Telegram, Facebook...),
// kompyuterda rasm nusxalanadi — Telegram yoki Facebook'ga Ctrl+V bilan joylashtirasiz.
$("ulashish").addEventListener("click", async () => {
  const xabar = $("ulashXabar");
  xabar.textContent = "Rasm tayyorlanmoqda…";
  const blob = await natijaRasminiTayyorla();
  const matn = ulashMatni();
  xabar.textContent = "";

  if (blob) {
    const fayl = new File([blob], "kim-aytgan.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [fayl] })) {
      try { await navigator.share({ files: [fayl], text: matn }); return; }
      catch (e) { if (e.name === "AbortError") return; }
    }
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        xabar.textContent = "Rasm nusxalandi — Telegram yoki Facebook'ga Ctrl+V bilan joylashtiring.";
        return;
      }
    } catch (e) { /* yuklab olishga o'tamiz */ }
    rasmniYuklabOl(blob);
    xabar.textContent = "Rasm yuklab olindi — uni Instagram, Telegram yoki Facebook'ga joylang.";
    return;
  }
  // Rasm chizib bo'lmasa — faqat matn
  if (navigator.share) {
    try { await navigator.share({ text: matn }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  if (await nusxaOl(matn)) xabar.textContent = "Natija matni nusxalandi.";
  else matnniKorsat(matn);
});

$("yuklab").addEventListener("click", async () => {
  const blob = await natijaRasminiTayyorla();
  if (blob) { rasmniYuklabOl(blob); $("ulashXabar").textContent = "Rasm yuklab olindi."; }
  else $("ulashXabar").textContent = "Rasmni tayyorlab bo'lmadi — sahifani sayt manzili orqali oching.";
});

$("matnNusxa").addEventListener("click", async () => {
  const matn = ulashMatni();
  if (await nusxaOl(matn)) $("ulashXabar").textContent = "Natija matni nusxalandi.";
  else matnniKorsat(matn);
});

portretniQur();
chiz();
</script>
